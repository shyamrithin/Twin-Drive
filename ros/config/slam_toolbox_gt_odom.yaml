# =============================================================================
# File        : ros/config/slam_toolbox_gt_odom.yaml
# Project     : TwinDrive — Lane-Free Autonomous Driving on a Digital Twin
#               of an Indian Campus (SRM Town / cm2, CARLA 0.9.16)
# Purpose     : MAPPING WITH PERFECT ODOMETRY. When /odom is ground truth (bridge
#               without --odom-noise) the poses are already correct, and scan
#               matching can only make them worse: on long straight campus roads
#               with few features the matcher slides/rotates the scans. Here
#               scan matching and loop closure are OFF, so the map is built from
#               the exact poses.  Use slam_toolbox.yaml for the --odom-noise runs.
#               Original notes: slam_toolbox (online async) settings for mapping the campus
#               from the bridge's /scan. Based on slam_toolbox's defaults, tuned
#               for a car-sized robot on a ~1.7 km x 1.3 km open campus:
#                 * resolution 0.25 m (a 0.05 m map of the whole campus would
#                   be hundreds of millions of cells)
#                 * longer range and larger loop-closure search, because
#                   campus features (buildings) are far apart
# Run         : ros2 launch slam_toolbox online_async_launch.py \
#                 slam_params_file:=$PWD/ros/config/slam_toolbox_gt_odom.yaml use_sim_time:=true
# =============================================================================
slam_toolbox:
  ros__parameters:
    # solver
    solver_plugin: solver_plugins::CeresSolver
    ceres_linear_solver: SPARSE_NORMAL_CHOLESKY
    ceres_preconditioner: SCHUR_JACOBI
    ceres_trust_strategy: LEVENBERG_MARQUARDT
    ceres_dogleg_type: TRADITIONAL_DOGLEG
    ceres_loss_function: None

    # frames and topics (must match the bridge)
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    use_sim_time: true
    mode: mapping
    use_map_saver: true
    debug_logging: false

    # timing
    throttle_scans: 1
    transform_publish_period: 0.05
    map_update_interval: 3.0
    minimum_time_interval: 0.3
    transform_timeout: 0.2
    tf_buffer_duration: 30.0
    stack_size_to_use: 40000000
    enable_interactive_mode: true

    # map
    resolution: 0.25
    max_laser_range: 40.0

    # scan matching
    use_scan_matching: false        # poses come straight from perfect odometry
    use_scan_barycenter: true
    minimum_travel_distance: 1.0
    minimum_travel_heading: 0.3
    scan_buffer_size: 10
    scan_buffer_maximum_scan_distance: 25.0
    link_match_minimum_response_fine: 0.1
    link_scan_maximum_distance: 3.0
    correlation_search_space_dimension: 0.5
    correlation_search_space_resolution: 0.01
    correlation_search_space_smear_deviation: 0.1

    # loop closure
    do_loop_closing: false          # nothing to correct; avoids false closures
    loop_search_maximum_distance: 10.0
    loop_match_minimum_chain_size: 10
    loop_match_maximum_variance_coarse: 3.0
    loop_match_minimum_response_coarse: 0.35
    loop_match_minimum_response_fine: 0.45
    loop_search_space_dimension: 8.0
    loop_search_space_resolution: 0.05
    loop_search_space_smear_deviation: 0.03

    # penalties
    distance_variance_penalty: 0.5
    angle_variance_penalty: 1.0
    fine_search_angle_offset: 0.00349
    coarse_search_angle_offset: 0.349
    coarse_angle_resolution: 0.0349
    minimum_angle_penalty: 0.9
    minimum_distance_penalty: 0.5
    use_response_expansion: true
